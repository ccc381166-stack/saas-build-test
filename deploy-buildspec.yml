version: 0.2
phases:
  install:
    commands:
      - curl -sLO https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl
      - chmod +x kubectl && mv kubectl /usr/local/bin/
  build:
    commands:
      - aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION
      - IMAGE=$(cat image.txt)
      - VERSION=$(cat version.txt)
      - sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|; s|VERSION_PLACEHOLDER|$VERSION|" k8s/$STRATEGY/rollout.yaml
      - kubectl apply -f k8s/common/
      - kubectl apply -f k8s/$STRATEGY/
      - kubectl -n demo get rollout
