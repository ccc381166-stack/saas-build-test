apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata: {name: demo-vs, namespace: demo}
spec:
  hosts: ['*']
  gateways: [demo-gateway]
  http:
  - name: primary
    route:
    - destination: {host: demo-app-stable, port: {number: 80}}
      weight: 100
    - destination: {host: demo-app-canary, port: {number: 80}}
      weight: 0
